        aria-expanded="false"

    <select id="filter-status">
        <option value="">همه وضعیت‌ها</option>
        <option value="ITM">در سود (ITM)</option>
        <option value="ATM">در نقطه (ATM)</option>
        <option value="OTM">خارج از سود (OTM)</option>
    </select>
    <!-- ارزش معاملات -->
    <div class="filter-group">
        <input type="number" id="filter-value" placeholder="ارزش معاملات (میلیون ریال)">
        
        <div class="arrow-buttons">
            <button onclick="setValueFilter('gt')" id="value-up">⬆</button>
            <button onclick="setValueFilter('lt')" id="value-down">⬇</button>
        </div>
    </div>

    <!-- روز باقی‌مانده -->
    <div class="filter-group">
        <input type="number" id="filter-days" placeholder="روز تا سررسید">
        
        <div class="arrow-buttons">
            <button onclick="setDaysFilter('gt')" id="days-up">⬆</button>
            <button onclick="setDaysFilter('lt')" id="days-down">⬇</button>
        </div>
    </div>

    <br><br>

    class="check-dropdown"
    data-placeholder="نماد پایه"

    <button
        type="button"
        class="check-dropdown-toggle"
        aria-expanded="false"
    >

        </span>

    <div class="spread-days-box">

        <input style="height: 44px;" type="number" id="spread-days" placeholder="روز تا سررسید">
<div class="checkbox-group arrow-buttons">
    <div class="checkbox-group arrow-buttons">

    <button
        type="button"
        id="days-up-spread"
        onclick="setSpreadDaysFilter('gte')"
        title="بیشتر یا مساوی"
    >
        ⬆
    </button>

    <button
        type="button"
        id="days-down-spread"
        onclick="setSpreadDaysFilter('lte')"
        title="کمتر یا مساوی"
    >
        ⬇
    </button>

    <button
        type="button"
        id="days-equal-spread"
